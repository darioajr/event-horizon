name: Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
  VCPKG_COMMIT: '75a2e14262fc23c1f03bac18e135c4866dd25b51'

jobs:
  # ==========================================================================
  # Calculate Version
  # ==========================================================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version_base: ${{ steps.version.outputs.version_base }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}
      version_full: ${{ steps.version.outputs.version_full }}
      build_number: ${{ steps.version.outputs.build_number }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Calculate version
      id: version
      run: |
        VERSION_BASE=$(cat version.txt | tr -d '\n\r ')
        BUILD_NUMBER=${{ github.run_number }}
        
        # Determine suffix based on branch
        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        if [[ "$BRANCH_NAME" == "main" ]]; then
          VERSION_SUFFIX=""
        elif [[ "$BRANCH_NAME" == "develop" ]]; then
          VERSION_SUFFIX="-dev"
        elif [[ "$BRANCH_NAME" == feature/* ]]; then
          VERSION_SUFFIX="-feature"
        else
          VERSION_SUFFIX="-other"
        fi
        
        # Compose full version
        if [[ -n "$VERSION_SUFFIX" ]]; then
          VERSION_FULL="${VERSION_BASE}${VERSION_SUFFIX}+${BUILD_NUMBER}"
        else
          VERSION_FULL="${VERSION_BASE}+${BUILD_NUMBER}"
        fi
        
        echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT
        echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
        echo "version_full=$VERSION_FULL" >> $GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        
        echo "::notice::Version: $VERSION_FULL"

  # ==========================================================================
  # Linux x64 Build
  # ==========================================================================
  build-linux-x64:
    runs-on: ubuntu-24.04
    needs: version
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
    
    - name: Create vcpkg cache directory
      run: mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
    
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-linux-x64-
    
    - name: Configure CMake
      run: |
        cmake --preset linux-release \
          -DVERSION_SUFFIX="${{ needs.version.outputs.version_suffix }}" \
          -DBUILD_NUMBER="${{ needs.version.outputs.build_number }}"
    
    - name: Build
      run: cmake --build build/linux-release --config ${{ env.BUILD_TYPE }}
    
    - name: Test
      working-directory: build/linux-release
      run: ctest --build-config ${{ env.BUILD_TYPE }} --output-on-failure
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-horizon-${{ needs.version.outputs.version_full }}-linux-x64
        path: build/linux-release/event_horizon
        retention-days: 30

  # ==========================================================================
  # Linux ARM64 Build
  # ==========================================================================
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: version
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
    
    - name: Create vcpkg cache directory
      run: mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
    
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-linux-arm64-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-linux-arm64-
    
    - name: Configure CMake
      run: |
        cmake --preset linux-arm64-release \
          -DVERSION_SUFFIX="${{ needs.version.outputs.version_suffix }}" \
          -DBUILD_NUMBER="${{ needs.version.outputs.build_number }}"
    
    - name: Build
      run: cmake --build build/linux-arm64-release --config ${{ env.BUILD_TYPE }}
    
    - name: Test
      working-directory: build/linux-arm64-release
      run: ctest --build-config ${{ env.BUILD_TYPE }} --output-on-failure
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-horizon-${{ needs.version.outputs.version_full }}-linux-arm64
        path: build/linux-arm64-release/event_horizon
        retention-days: 30

  # ==========================================================================
  # macOS x64 Build (Intel)
  # ==========================================================================
  build-macos-x64:
    runs-on: macos-15-intel
    needs: version
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: brew install ninja
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
    
    - name: Create vcpkg cache directory
      run: mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
    
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-macos-x64-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-macos-x64-
    
    - name: Configure CMake
      run: |
        cmake --preset macos-release \
          -DVERSION_SUFFIX="${{ needs.version.outputs.version_suffix }}" \
          -DBUILD_NUMBER="${{ needs.version.outputs.build_number }}"
    
    - name: Build
      run: cmake --build build/macos-release --config ${{ env.BUILD_TYPE }}
    
    - name: Test
      working-directory: build/macos-release
      run: ctest --build-config ${{ env.BUILD_TYPE }} --output-on-failure
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-horizon-${{ needs.version.outputs.version_full }}-macos-x64
        path: build/macos-release/event_horizon
        retention-days: 30

  # ==========================================================================
  # macOS ARM64 Build (Apple Silicon)
  # ==========================================================================
  build-macos-arm64:
    runs-on: macos-14
    needs: version
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: brew install ninja
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
    
    - name: Create vcpkg cache directory
      run: mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
    
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-macos-arm64-
    
    - name: Configure CMake
      run: |
        cmake --preset macos-arm64-release \
          -DVERSION_SUFFIX="${{ needs.version.outputs.version_suffix }}" \
          -DBUILD_NUMBER="${{ needs.version.outputs.build_number }}"
    
    - name: Build
      run: cmake --build build/macos-arm64-release --config ${{ env.BUILD_TYPE }}
    
    - name: Test
      working-directory: build/macos-arm64-release
      run: ctest --build-config ${{ env.BUILD_TYPE }} --output-on-failure
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-horizon-${{ needs.version.outputs.version_full }}-macos-arm64
        path: build/macos-arm64-release/event_horizon
        retention-days: 30

  # ==========================================================================
  # Windows x64 Build
  # ==========================================================================
  build-windows-x64:
    runs-on: windows-latest
    needs: version
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
    
    - name: Create vcpkg cache directory
      run: New-Item -ItemType Directory -Force -Path ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
    
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-windows-x64-
    
    - name: Configure CMake
      run: |
        cmake --preset windows-ninja `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DVERSION_SUFFIX="${{ needs.version.outputs.version_suffix }}" `
          -DBUILD_NUMBER="${{ needs.version.outputs.build_number }}"
    
    - name: Build
      run: cmake --build build/windows-ninja --config ${{ env.BUILD_TYPE }}
    
    - name: Test
      working-directory: build/windows-ninja
      run: ctest --build-config ${{ env.BUILD_TYPE }} --output-on-failure
    
    - name: Prepare distribution
      run: |
        New-Item -ItemType Directory -Force -Path dist
        Copy-Item build/windows-ninja/event_horizon.exe dist/
        # Copy dependency DLLs from vcpkg
        if (Test-Path "build/windows-ninja/vcpkg_installed/x64-windows/bin") {
          Copy-Item build/windows-ninja/vcpkg_installed/x64-windows/bin/*.dll dist/
        }
        Get-ChildItem dist/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-horizon-${{ needs.version.outputs.version_full }}-windows-x64
        path: dist/*
        retention-days: 30

  # ==========================================================================
  # Windows x64 Static Build
  # ==========================================================================
  build-windows-static:
    runs-on: windows-latest
    needs: version
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
    
    - name: Create vcpkg cache directory
      run: New-Item -ItemType Directory -Force -Path ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
    
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-windows-static-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-windows-static-
    
    - name: Configure CMake (Static)
      run: |
        cmake --preset windows-ninja-static `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DVERSION_SUFFIX="${{ needs.version.outputs.version_suffix }}" `
          -DBUILD_NUMBER="${{ needs.version.outputs.build_number }}"
    
    - name: Build
      run: cmake --build build/windows-ninja-static --config ${{ env.BUILD_TYPE }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-horizon-${{ needs.version.outputs.version_full }}-windows-static
        path: build/windows-ninja-static/event_horizon.exe
        retention-days: 30

  # ==========================================================================
  # Create Release
  # ==========================================================================
  release:
    needs: [version, build-linux-x64, build-linux-arm64, build-macos-x64, build-macos-arm64, build-windows-x64, build-windows-static]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    
    - name: Create archives
      run: |
        VERSION="${{ needs.version.outputs.version_full }}"
        
        # Linux x64
        chmod +x ./artifacts/event-horizon-${VERSION}-linux-x64/event_horizon
        tar -czvf event-horizon-${VERSION}-linux-x64.tar.gz \
          -C ./artifacts/event-horizon-${VERSION}-linux-x64 event_horizon
        
        # Linux ARM64
        chmod +x ./artifacts/event-horizon-${VERSION}-linux-arm64/event_horizon
        tar -czvf event-horizon-${VERSION}-linux-arm64.tar.gz \
          -C ./artifacts/event-horizon-${VERSION}-linux-arm64 event_horizon
        
        # macOS x64
        chmod +x ./artifacts/event-horizon-${VERSION}-macos-x64/event_horizon
        tar -czvf event-horizon-${VERSION}-macos-x64.tar.gz \
          -C ./artifacts/event-horizon-${VERSION}-macos-x64 event_horizon
        
        # macOS ARM64
        chmod +x ./artifacts/event-horizon-${VERSION}-macos-arm64/event_horizon
        tar -czvf event-horizon-${VERSION}-macos-arm64.tar.gz \
          -C ./artifacts/event-horizon-${VERSION}-macos-arm64 event_horizon
        
        # Windows x64
        zip -j event-horizon-${VERSION}-windows-x64.zip \
          ./artifacts/event-horizon-${VERSION}-windows-x64/event_horizon.exe
        
        # Windows Static
        zip -j event-horizon-${VERSION}-windows-static.zip \
          ./artifacts/event-horizon-${VERSION}-windows-static/event_horizon.exe
        
        # List created files
        ls -la *.tar.gz *.zip
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.version.outputs.version_full }}
        name: Release v${{ needs.version.outputs.version_full }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          event-horizon-${{ needs.version.outputs.version_full }}-linux-x64.tar.gz
          event-horizon-${{ needs.version.outputs.version_full }}-linux-arm64.tar.gz
          event-horizon-${{ needs.version.outputs.version_full }}-macos-x64.tar.gz
          event-horizon-${{ needs.version.outputs.version_full }}-macos-arm64.tar.gz
          event-horizon-${{ needs.version.outputs.version_full }}-windows-x64.zip
          event-horizon-${{ needs.version.outputs.version_full }}-windows-static.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
