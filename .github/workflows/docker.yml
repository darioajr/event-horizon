name: Docker Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.2.3-beta
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g., latest, 1.0.0)'
        required: true
        default: 'latest'

env:
  IMAGE_NAME: darioajr/eventhorizon
  REGISTRY: docker.io

jobs:
  # ==========================================================================
  # Build and Push Docker Image
  # ==========================================================================
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Read version from file
        id: version
        run: |
          VERSION_BASE=$(cat version.txt | tr -d '\n\r ')
          echo "version_base=${VERSION_BASE}" >> $GITHUB_OUTPUT
      
      - name: Prepare metadata
        id: meta
        run: |
          # Get version from tag or input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"  # Remove 'v' prefix from tag
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "vcs_ref=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/v{0}', steps.version.outputs.version_base) }}
            type=sha,prefix=
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_NUMBER=${{ steps.meta.outputs.build_number }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
            VCS_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Kafka-Compatible Event Streaming Platform in C++"
          readme-filepath: ./README.md

  # ==========================================================================
  # Verify Docker Image
  # ==========================================================================
  verify:
    runs-on: ubuntu-latest
    needs: docker
    
    steps:
      - name: Pull and test image
        run: |
          # Get version
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          
          echo "Testing image: ${{ env.IMAGE_NAME }}:${VERSION}"
          
          # Pull the image
          docker pull ${{ env.IMAGE_NAME }}:${VERSION}
          
          # Run container and check if it starts
          docker run -d --name eventhorizon-test \
            -p 9092:9092 \
            ${{ env.IMAGE_NAME }}:${VERSION}
          
          # Wait for startup
          sleep 5
          
          # Check if container is running
          if docker ps | grep -q eventhorizon-test; then
            echo "✅ Container started successfully"
          else
            echo "❌ Container failed to start"
            docker logs eventhorizon-test
            exit 1
          fi
          
          # Check if port is listening
          if nc -z localhost 9092; then
            echo "✅ Port 9092 is listening"
          else
            echo "⚠️ Port 9092 is not listening (may need more time)"
          fi
          
          # Cleanup
          docker stop eventhorizon-test
          docker rm eventhorizon-test
          
          echo "✅ Docker image verification complete"
